[package]
name = "geeta_assessment_portal"
version = "0.1.0"
description = "Windows desktop client for the Geeta University Coding Assessment Portal"
authors = ["Geeta University"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "geeta_assessment_portal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
