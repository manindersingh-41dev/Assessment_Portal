version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gateqa_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-geeta_assessment}
      POSTGRES_USER: ${DB_USER:-django}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?error}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-django}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateqa_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gateqa_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateqa_network

  # Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateqa_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?error}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://${DB_USER:-django}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-geeta_assessment}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - gateqa_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: gateqa_celery
    command: celery -A config worker -l info --concurrency 4
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?error}
      DATABASE_URL: postgresql://${DB_USER:-django}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-geeta_assessment}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./:/app
    networks:
      - gateqa_network
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "active_queues"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Beat (Scheduled Tasks)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: gateqa_celery_beat
    command: celery -A config beat -l info
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?error}
      DATABASE_URL: postgresql://${DB_USER:-django}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-geeta_assessment}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
    networks:
      - gateqa_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gateqa_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - gateqa_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  gateqa_network:
    driver: bridge
